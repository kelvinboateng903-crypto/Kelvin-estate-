<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelvin Estates</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#9ed0f0;--pill:#1c1c1c;--pt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:#f3efe6;--pt:#15161a}}
:root[data-theme="dark"]{--pill:#f3efe6;--pt:#15161a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:var(--pill);color:var(--pt);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;border:0;opacity:.92}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
#bar{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);text-align:center;pointer-events:none;transition:opacity 1.5s}
#jr,#jk{position:fixed;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#jr{width:100px;height:100px;border:3px solid rgba(255,255,255,.7)}#jk{width:44px;height:44px;background:rgba(255,255,255,.8)}
#stick{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.75);box-shadow:0 2px 10px rgba(0,0,0,.3);touch-action:none;cursor:grab;z-index:6}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none}
#mm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:96px;height:147px;border-radius:10px;border:2px solid var(--pill);box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:5}
#mm.big{width:auto;height:min(80vh,640px);aspect-ratio:28/43;max-width:94vw;top:50%;right:auto;left:50%;transform:translate(-50%,-50%);border-width:3px}
#chat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);max-width:80vw;text-align:center;display:none;z-index:7;line-height:1.35}
#hl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:20}
#hl.on{display:flex}
#hp{background:var(--pill);color:var(--pt);padding:16px;border-radius:18px;max-width:92vw}
#hp h3{margin:0 0 10px;font-size:15px;text-align:center}
#hg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#hg button,#hx{background:var(--pt);color:var(--pill);border:0;border-radius:12px;padding:12px 0;min-width:56px;font-size:15px;font-weight:700}
#hx{width:100%;margin-top:10px}
#hgate{width:100%;margin-bottom:10px;background:#c9a24a;color:#1c1c1c;border:0;border-radius:12px;padding:12px 0;font-size:15px;font-weight:700}
#act{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);display:none;z-index:7;padding:10px 16px;font-size:14px;background:#c9a24a;color:#1c1c1c}
#chat{bottom:calc(env(safe-area-inset-bottom,0px) + 205px)!important}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;max-width:86vw;text-align:center}
#shop,#ph{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:30}
#shop.on,#ph.on{display:flex}
#scd{background:var(--pill);color:var(--pt);padding:16px;border-radius:18px;width:min(92vw,380px);max-height:84vh;overflow:auto}
#scd h3{margin:0 0 4px;font-size:17px;text-align:center}#scd .sub{text-align:center;font-size:12px;opacity:.7;margin-bottom:10px}
.pr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(128,128,128,.18);margin-bottom:8px;cursor:pointer}
.pr .em{font-size:26px}.pr .nm{flex:1;font-weight:600;font-size:14px}.pr .pc{font-size:13px;opacity:.8}
.pr button,#shx{background:#c9a24a;color:#1c1c1c;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
#shx{width:100%;margin-top:4px;background:var(--pt);color:var(--pill)}
#pd{position:relative;height:min(86vh,660px);aspect-ratio:9/19.5;max-width:92vw;background:#0b0b0d;border-radius:46px;padding:9px;box-shadow:0 0 0 2px #555,0 20px 60px rgba(0,0,0,.6)}
#pi{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:linear-gradient(160deg,#2b6cd9,#7b2ff7 60%,#f7797d);color:#fff;display:flex;flex-direction:column;font-family:-apple-system,system-ui,sans-serif}
#notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:38%;height:25px;background:#0b0b0d;border-radius:0 0 18px 18px;z-index:3}
#sb{display:flex;justify-content:space-between;padding:7px 20px 0;font-size:12px;font-weight:700;height:24px;z-index:2}
#scr{flex:1;overflow:auto;padding:14px 12px 8px}
#hb{height:5px;width:36%;background:#fff;border-radius:3px;margin:6px auto 8px;cursor:pointer;flex:none}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;text-align:center;font-size:10px;margin-top:10px}
.ap{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ap i{font-style:normal;width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:27px}
.wd{background:rgba(255,255,255,.18);border-radius:18px;padding:12px;text-align:center}.wd b{font-size:36px;font-weight:300;display:block}
.c2{background:rgba(255,255,255,.18);border-radius:14px;padding:10px;margin-bottom:8px;font-size:13px}
.pb{background:#fff;color:#111;border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:12px;margin:3px 3px 3px 0}
.ph2{font-size:20px;font-weight:700;margin:2px 0 10px}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:2px solid #fff}
#feed{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 200px);display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:70vw;z-index:8}
#feed div{background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:5px 10px;font-size:12px}
#cin{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 60px);display:none;gap:6px;z-index:25}
#cinp{flex:1;border-radius:999px;border:0;padding:10px 14px;font-size:15px}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span class="pill" id="fl"></span><span class="pill" id="rm"></span><span class="pill" id="mny"></span><span class="pill" id="onl">Solo</span></div>
<canvas id="mm" width="392" height="602"></canvas>
<div id="bar"><button class="pill" id="bc">💬 Chat</button><button class="pill" id="bp">📱 Phone</button><button class="pill" id="bh">Houses</button><button class="pill" id="bv">View: Showcase</button><button class="pill" id="bm">Map</button><button class="pill" id="br">Reset</button></div>
<div id="hint"><span class="pill">Welcome to Kelvin Estates · tap Houses to visit any of the 20 · stick moves · drag looks/orbits · WASD works</span></div>
<div id="feed"></div><div id="cin"><input id="cinp" maxlength="120" placeholder="Say something..."><button class="pill" id="cis">Send</button></div><div id="chat" class="pill"></div><button class="pill" id="act"></button><div id="toast" class="pill"></div>
<div id="shop"><div id="scd"><h3 id="shn"></h3><div class="sub" id="shs"></div><div id="shl"></div><button id="shx">Close</button></div></div>
<div id="ph"><div id="pd"><div id="pi"><div id="notch"></div><div id="sb"><span id="clk"></span><span id="sbr">5G ▮▮▮ 🔋</span></div><div id="scr"></div><div id="hb"></div></div></div></div>
<div id="hl"><div id="hp"><h3>Kelvin Estates – pick where to go</h3><button id="hgate">Main Gate</button><div id="hg"></div><button id="hx">Close</button></div></div>
<div id="stick"><div id="knob"></div></div><div id="jr"></div><div id="jk"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ EDIT ME: your character ============
const CHARACTER={name:"Ada",shirt:"#e8833a",pants:"#2c3e50",skin:"#c68642",hair:"#222222",speed:6,scale:1};

// ============ ONLINE PLAY (no Claude account needed) ============
// If you host server.js (see README), the game connects to it automatically when served from the same address.
// If you host this HTML somewhere else, put your server address here, e.g. "wss://kelvin-estates.onrender.com"
const MULTIPLAYER_SERVER="";

// ============ ESTATE LAYOUT ============
const COLS=4,ROWS=5,PX=40,PZ=68,EX0=0,EZ0=0;   // 20 plots, each 40 x 68 m
const OZ=10,FH=3.2,W=28,FJ=30+OZ;
// ============ BASE HOUSE (from your plan; 1 unit = 1 m) ============
const ROOMS=[
[0,"Bedroom",5,2,8,8,"#e6d3bd"],[0,"Atrium",14,2,5,8,"#efe6cf"],[0,"Gym",21,2,5,8,"#c9d6d9"],
[0,"Grand Living Area",5,11,13,7,"#e8d9b8"],[0,"Master Suite",21,11,5,9,"#ead9a8"],
[0,"Kitchen",5,19,8,6,"#e4e0d4"],[0,"Entrance Hall",14,19,6,6,"#efe6cf"],[0,"Lever Gym",21,21,5,4,"#c9d6d9"],
[0,"Garage",5,26,8,4,"#b8b8b8"],[0,"Entrance Hall",14,26,6,4,"#efe6cf"],[0,"Bedroom",21,26,5,4,"#e6d3bd"],
[0,"Terraces",1,3,3,22,"#cdbfa6"],[0,"Porch",14,31,6,3,"#cdbfa6"],
[0,"Rear Patio",5,-8,21,2,"#cdbfa6"],[0,"Rear Patio",5,-2,21,3,"#cdbfa6"],
[1,"Bedroom 1",5,2,8,8,"#e6d3bd"],[1,"Bedroom 2",21,2,5,8,"#e6d3bd"],[1,"Upper Lounge",5,11,13,8,"#e8d9b8"],
[1,"Master Suite 2",21,11,5,9,"#ead9a8"],[1,"Stairwell",15,19,4,5,"#d8c9a5"]];
const DOORS=[[0,8,10,2,1],[0,15,10,3,1],[0,22,10,2,1],[0,18,13,3,2],[0,8,18,2,1],[0,13,24,1,1],[0,20,24,1,1],[0,16,25,2,1],[0,13,27,1,2],[0,20,27,1,2],[0,22,25,2,1],
[0,4,5,1,2],[0,4,13,1,2],[0,4,21,1,2],[0,7,1,2,1],[0,15,1,3,1],[0,22,1,2,1],[0,15,30,4,1],[0,6,30,5,1],
[1,8,10,2,1],[1,23,10,2,1],[1,18,13,3,2]];
const FURN=[
[0,8.5,27,4.4,1.9,1,"#c0392b","car"],[0,8.5,29,4.4,1.9,1,"#2c3e50","car"],
[0,10,16,5,1.1,.8,"#607d8b"],[0,10,13.5,2.4,1.6,.4,"#8d6e63"],[0,8,22,4,1.6,.9,"#90a4ae"],
[0,23.5,14,3,3.2,.6,"#7e57c2","bed"],[0,8.5,5,3,3.2,.6,"#7e57c2","bed"],[0,23.5,28,2.6,3,.6,"#7e57c2","bed"],
[0,23.5,4,3,1.4,1,"#455a64"],[0,23.5,7,3,1.4,1,"#455a64"],[0,6.5,-4.2,.9,2,.4,"#ffffff"],[0,24,-4.2,.9,2,.4,"#ffffff"],
[1,8.5,5,3,3.2,.6,"#7e57c2","bed"],[1,23.5,5,3,3.2,.6,"#5c6bc0","bed"],[1,23.5,15,3,3.2,.6,"#7e57c2","bed"],[1,10,15,5,1.1,.8,"#a1887f"],[1,10,13,2.4,1.6,.4,"#8d6e63"]];
const POOLX=[[9,13],[10,11],[12,7]];   // pool x,width variants (pool 3 = garden instead)
// ============ HOW EACH HOUSE DIFFERS (edit these) ============
const WALL=['#f1ece0','#ece3d0','#e5ded0','#f5f0e8','#dde2e4','#f0e2d6','#e7e4dc','#f7f2e6','#d8dcdc','#efdfcb'];
const STONE=['#8f887b','#7a7367','#a39887','#6e6a62','#8a7b68','#9b9588'];
const ROOF=['#2b2f35','#3b2e29','#25323b','#303030','#4a3b32','#34403a','#3d2b2e','#2b3042'];
const DOORC=['#3b2a20','#1f2a36','#4a1f1f','#23342b','#2b2b2b','#5a3d1f'];
const CARC=['#c0392b','#2c3e50','#7f8c8d','#16a085','#8e44ad','#2980b9','#d35400','#34495e'];
const VAR=Array.from({length:COLS*ROWS},(_,k)=>({
  mir:k>0&&(k%3==1||k%7==5),            // mirrored floor plan
  wall:WALL[(k*3)%10],stone:STONE[(k*5)%6],roof:ROOF[(k*3+k%2)%8],door:DOORC[(k*5)%6],
  pool:k%4,                             // 0-2 pool sizes, 3 = garden
  wm:[4,3,5,4,3][k%5],                  // window spacing
  rh:5.6+Math.sin(k*2.1)*.7,            // roof height
  gh:1.8+(k%3)*.4,                      // wing roof height
  chim:2-(k%3==2?1:0),car:k}));

// ============ DATA ============
const LX=PX,LZ=PZ,G=()=>Array.from({length:2},()=>Array.from({length:LZ},()=>Array(LX).fill(0)));
const rect=(x,z,w,d,f)=>{for(let j=Math.floor(z);j<z+d-.001;j++)for(let i=Math.floor(x);i<x+w-.001;i++)f(i,j)};
const FL=[],SP=[];                       // global flat boxes + foliage spheres
const Bx=(a,x,y0,y1,z,c,sx=1,sz=1)=>a.push([x,y0,y1,z,c,sx,sz]);
const HS=[];
const scene=new THREE.Scene();
const lam=(o={})=>new THREE.MeshLambertMaterial(o);

function hip(H,x0,z0,x1,z1,y,h,ov,c){x0-=ov;z0-=ov;x1+=ov;z1+=ov;const w=x1-x0,d=z1-z0,s=Math.min(w,d)/2,cx=(x0+x1)/2,cz=(z0+z1)/2;
  const A=[x0,y,z0],Bc=[x1,y,z0],C=[x1,y,z1],D=[x0,y,z1];let t;
  if(d>=w){const r0=[cx,y+h,z0+s],r1=[cx,y+h,z1-s];t=[A,Bc,r0,Bc,C,r1,Bc,r1,r0,C,D,r1,D,A,r0,D,r0,r1];}
  else{const r0=[x0+s,y+h,cz],r1=[x1-s,y+h,cz];t=[D,A,r0,A,Bc,r1,A,r1,r0,Bc,C,r1,C,D,r0,C,r0,r1];}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(t.flat(),3));g.computeVertexNormals();
  H.hipG.add(new THREE.Mesh(g,lam({color:c,side:THREE.DoubleSide,flatShading:true})));}

function signTex(n){const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d');g.fillStyle='#1c1c1c';g.fillRect(0,0,128,64);
  g.fillStyle='#f3efe6';g.font='bold 38px system-ui';g.textAlign='center';g.fillText('No. '+n,64,46);return new THREE.CanvasTexture(c)}

function mkHouse(k){
  const v=VAR[k],mir=v.mir,mx=(x,w)=>mir?W-x-w:x,mc=x=>mir?W-x:x,sm=i=>mir?27-i:i,rx=(a,b)=>mir?[W-b,W-a]:[a,b];
  const H={k,v,mc,sm,ox:EX0+(k%COLS)*PX,oz:EZ0+Math.floor(k/COLS)*PZ,det:null};
  let rm=ROOMS.slice(),pl=null;
  if(v.pool<3){const[px,pw]=POOLX[v.pool];pl=[px,-6,pw,4];rm.push([0,"Rear Patio",5,-6,px-5,4,"#cdbfa6"],[0,"Rear Patio",px+pw,-6,26-px-pw,4,"#cdbfa6"]);}
  else rm.push([0,"Garden",5,-6,21,4,"#8fbf7a"]);
  H.rooms=rm.map(([l,n,x,z,w,d,c])=>[l,n,mx(x,w),z+OZ,w,d,c]);
  H.doors=DOORS.map(([l,x,z,w,d])=>[l,mx(x,w),z+OZ,w,d]);
  H.furn=FURN.map(f=>{const g=f.slice();g[1]=mc(f[1]);g[2]+=OZ;if(g[7]=="car")g[6]=CARC[(v.car+(g[2]>38?0:1))%8];return g});
  H.vo=[mx(13,8),1+OZ,8,10];H.ramp={x:mx(15,4),z:19+OZ,w:4,d:5};H.pl=pl&&[mx(pl[0],pl[2]),pl[1]+OZ,pl[2],pl[3]];
  const walk=G(),name=G(),col=G(),door=G(),blk=G(),kind=G(),slab=Array.from({length:LZ},()=>Array(LX).fill(0));
  Object.assign(H,{walk,name,col,door,blk,kind,slab});
  const bx0=mir?1:4,bx1=mir?23:26;
  H.inV=(i,j)=>i>=H.vo[0]&&i<H.vo[0]+H.vo[2]&&j>=H.vo[1]&&j<H.vo[1]+H.vo[3];
  H.inP=(i,j)=>H.pl&&i>=H.pl[0]&&i<H.pl[0]+H.pl[2]&&j>=H.pl[1]&&j<H.pl[1]+H.pl[3];
  H.body=(i,j)=>i>=bx0&&i<=bx1&&j>=1+OZ&&j<=FJ;
  H.rooms.forEach(([l,n,x,z,w,d,c])=>rect(x,z,w,d,(i,j)=>{walk[l][j][i]=/Terrace|Porch|Patio|Garden/.test(n)?2:1;name[l][j][i]=n;col[l][j][i]=c;}));
  H.doors.forEach(([l,x,z,w,d])=>rect(x,z,w,d,(i,j)=>{walk[l][j][i]=1;door[l][j][i]=1;name[l][j][i]="Doorway";col[l][j][i]="#c9b88f";}));
  const R=H.ramp;for(let j=R.z;j<R.z+R.d;j++){blk[0][j][R.x-1]=1;blk[0][j][R.x+R.w]=1;}
  const forced=(l,i,j)=>l==1&&j==H.vo[1]&&i>=H.vo[0]&&i<H.vo[0]+H.vo[2];
  for(let l=0;l<2;l++)for(let j=0;j<LZ;j++)for(let i=0;i<LX;i++){
    if(walk[l][j][i]||(l==0&&H.inP(i,j)))continue;let a1=0,a2=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const q=walk[l][j+dy]?.[i+dx];if(q==1)a1=1;else if(q==2)a2=1;}
    kind[l][j][i]=forced(l,i,j)?1:a1?(l==1&&H.inV(i,j)?2:1):a2?2:0;}
  for(let s=6;s<=10;s++)kind[0][FJ+1][sm(s)]=0;           // open garage doors
  for(let s=15;s<=18;s++)kind[0][34+OZ][sm(s)]=0;         // opening in porch rail
  H.furn.forEach(([l,x,z,w,d,h])=>rect(x-w/2+.02,z-d/2+.02,w-.04,d-.04,(i,j)=>blk[l][j][i]=1));
  // ---- always-visible parts ----
  const root=new THREE.Group();root.position.set(H.ox,0,H.oz);scene.add(root);H.root=root;
  H.hipG=new THREE.Group();root.add(H.hipG);
  const [a0,a1]=rx(4,27),[g0_,g1_]=rx(4,14),[f0,f1]=rx(20,27);
  hip(H,a0,1+OZ,a1,25+OZ,6.4,v.rh,.9,v.roof);hip(H,g0_,25+OZ,g1_,31+OZ,3.2,v.gh,.8,v.roof);hip(H,f0,25+OZ,f1,31+OZ,3.2,v.gh,.8,v.roof);
  [8.5,23].slice(0,v.chim).forEach(x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1.4,5.6,1.4),lam({color:v.stone}));m.position.set(mc(x),9.7,14+OZ);H.hipG.add(m);});
  H.proxy=new THREE.Group();root.add(H.proxy);
  const pbox=(x0,x1,z0,z1,h)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,h,z1-z0),lam({color:v.wall}));m.position.set((x0+x1)/2,h/2,(z0+z1)/2);H.proxy.add(m);};
  pbox(a0,a1,1+OZ,25+OZ,6.2);pbox(a0,a1,25+OZ,31+OZ,3.1);
  const o=(x,y0,y1,z,c,sx,sz)=>Bx(FL,x+H.ox,y0,y1,z+H.oz,c,sx,sz);

  if(len>.1){const tx=-sy*iy+cy*ix,tz=-cy*iy-sy*ix,df=wr(Math.atan2(tx,tz)-v.hd);v.hd+=cl(df,-S.turn*dt,S.turn*dt);v.sp+=(S.max*len*Math.max(.25,Math.cos(df))-v.sp)*Math.min(1,dt*2);}
  else v.sp*=Math.max(0,1-dt*2.5);
  const nx=v.x+Math.sin(v.hd)*v.sp*dt,nz=v.z+Math.cos(v.hd)*v.sp*dt;
  if(vOk(nx,nz,v.hd,S)){v.x=nx;v.z=nz;}else v.sp=0;
  v.g.position.set(v.x,0,v.z);v.g.rotation.y=v.hd;P.x=v.x;P.z=v.z;P.l=0;P.y=0;hum.rotation.y=v.hd;}
function mount(v){RID=v;v.pts=null;v.sp=0;P.l=0;P.y=0;P.x=v.x;P.z=v.z;if(view<2)setView(2);toast('Riding '+VS[v.type].name+' · stick steers · Get off button to stop');}
function dismount(){const v=RID;for(const a of [Math.PI/2,-Math.PI/2,Math.PI,0]){const x=v.x+Math.sin(v.hd+a)*1.8,z=v.z+Math.cos(v.hd+a)*1.8;if(okV(x,z)&&ok(x,z,0)){P.x=x;P.z=z;break;}}
  RID=null;v.sp=0;}
function callRide(t){const S=VS[t];if(ST.air<100){toast('Not enough airtime. Buy some at Kelvin Mart 📱');return;}
  if(ST.money<S.fare){toast('Not enough money 😕');return;}
  ST.money-=S.fare;ST.air-=100;ST.sms.unshift('Ride booked: '+S.name+' · '+fmt(S.fare));upd$();
  if(RID)dismount();let spot=null;for(let a=0;a<6.3&&!spot;a+=.7){const x=P.x+Math.sin(a)*3,z=P.z+Math.cos(a)*3;if(okV(x,z)&&vOk(x,z,0,S))spot={x,z};}
  const v=addVeh(t,{okada:'#d62828',keke:'#f4c20d',car:'#2a9d8f'}[t],spot?spot.x:P.x,spot?spot.z:P.z,hum.rotation.y);closePhone();mount(v);toast('Your '+S.name+' has arrived!');}
// contextual action button (Shop / Ride / Get off)
function updAct(){let lab='',fn=null;const b=busy();
  if(RID){lab='⬇ Get off '+VS[RID.type].name;fn=dismount;}
  else if(!b&&P.l==0){let bv=null,bd=3.6;VEH.forEach(v=>{const d=Math.hypot(P.x-v.x,P.z-v.z);if(d<bd){bd=d;bv=v;}});
    if(bv){lab=VS[bv.type].ico+' Ride '+VS[bv.type].name;fn=()=>mount(bv);}
    else{let bk=null,kd=4.6;KIOSKS.forEach(k=>{const d=Math.hypot(P.x-k.x,P.z-k.z);if(d<kd){kd=d;bk=k;}});if(bk){lab='🛒 Shop · '+bk.n;fn=()=>openShop(bk);}}}
  actFn=fn;act.style.display=fn&&!b?'block':'none';if(fn)act.textContent=lab;}
act.onclick=()=>actFn&&actFn();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(typing()&&k!='escape')return;if(k=='e'&&actFn&&!busy())actFn();if(k=='p')phOn?closePhone():openPhone();if(k=='escape'){closeShop();closePhone();hl.classList.remove('on');}});
upd$();


// ============ MULTIPLAYER (Claude room) ============
const RP={};let ROOM=null,nsT=0;
if(!ST.name)ST.name=CHARACTER.name+Math.floor(10+Math.random()*90);
const onl=document.getElementById('onl'),feed=document.getElementById('feed'),cin=document.getElementById('cin'),cinp=document.getElementById('cinp');
function typing(){return /INPUT/.test((document.activeElement&&document.activeElement.tagName)||'');}
function setName(v){v=String(v).trim().slice(0,14);if(v)ST.name=v;upd$();}
function nameSprite(t){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,256,64);g.fillStyle='#fff';g.font='bold 34px system-ui';g.textAlign='center';g.fillText(t,128,44);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.scale.set(2.4,.6,1);sp.position.y=2.4;sp.renderOrder=5;return sp;}
function mkRemote(p){const h=human(typeof p.s=='string'?p.s:'#e8833a','#2c3e50','#c68642','#222222');
  const r=Object.assign(h,{x:p.x,z:p.z,y:0,hd:0,tx:p.x,tz:p.z,ty:0,th:0,ph:0,s:p.s,n:p.n,veh:null,vt:null,vm:null});
  r.lab=nameSprite(String(p.n||'Player').slice(0,14));h.g.add(r.lab);return r;}
function rmRemote(r){scene.remove(r.g);if(r.vm)scene.remove(r.vm);}
function syncPeers(ch){const seen={};
  ch.peers.forEach(pe=>{if(pe.isMe||pe.kind!=='viewer')return;const p=pe.presence;if(typeof p.x!=='number'||typeof p.z!=='number')return;
    seen[pe.peer]=1;let r=RP[pe.peer];if(r&&r.s!==p.s){rmRemote(r);r=null;}
    if(!r)r=RP[pe.peer]=mkRemote(p);
    if(r.n!==p.n){r.g.remove(r.lab);r.n=p.n;r.lab=nameSprite(String(p.n||'Player').slice(0,14));r.g.add(r.lab);}
    r.tx=p.x;r.tz=p.z;r.ty=+p.y||0;r.th=+p.hd||0;r.veh=typeof p.v=='string'&&VS[p.v]?p.v:null;});
  for(const k in RP)if(!seen[k]){rmRemote(RP[k]);delete RP[k];}
  onl.textContent='🌐 '+(1+Object.keys(RP).length)+' online';}
function updRemote(dt){for(const k in RP){const r=RP[k],f=Math.min(1,dt*10),px=r.x,pz=r.z;
  r.x+=(r.tx-r.x)*f;r.z+=(r.tz-r.z)*f;r.y+=(r.ty-r.y)*f;const mv=Math.hypot(r.x-px,r.z-pz)/Math.max(dt,.001);r.hd+=wr(r.th-r.hd)*f;
  if(r.veh!==r.vt){if(r.vm){scene.remove(r.vm);r.vm=null;}if(r.veh)r.vm=mkVeh(r.veh,'#3a86ff');r.vt=r.veh;}
  const rd=!!r.veh;r.g.visible=!rd||r.veh=='okada';r.g.position.set(r.x,r.y+(rd?.55:0),r.z);r.g.rotation.y=r.hd;
  if(r.vm){r.vm.position.set(r.x,0,r.z);r.vm.rotation.y=r.hd;}
  r.ph+=dt*mv*1.2;const sw=mv>.5&&!rd?Math.sin(r.ph)*.7:0;r.lL.rotation.x=sw;r.lR.rotation.x=-sw;r.aL.rotation.x=-sw;r.aR.rotation.x=sw;}}
function netSend(now){if(!ROOM||now-nsT<90)return;nsT=now;
  ROOM.presence({x:+P.x.toFixed(2),z:+P.z.toFixed(2),y:+P.y.toFixed(2),l:P.l,hd:+(RID?RID.hd:hum.rotation.y).toFixed(2),n:ST.name,s:ST.shirt,v:RID?RID.type:null}).catch(()=>{});}
function addFeed(t){const d=document.createElement('div');d.textContent=t;feed.appendChild(d);while(feed.children.length>6)feed.removeChild(feed.firstChild);setTimeout(()=>d.remove(),9000);}
function sendChat(){const t=cinp.value.trim().slice(0,120);cinp.value='';cin.style.display='none';cinp.blur();if(!t)return;
  if(!ROOM||!ROOM.connected()){addFeed('You: '+t);return;}
  ROOM.emit('chat',{n:ST.name,t}).catch(()=>{addFeed('You: '+t);toast('Others can’t see chat from your access level');});}
document.getElementById('bc').onclick=()=>{cin.style.display='flex';cinp.focus();};
document.getElementById('cis').onclick=sendChat;cinp.onkeydown=e=>{if(e.key=='Enter')sendChat();};
function wsUrl(){if(MULTIPLAYER_SERVER)return MULTIPLAYER_SERVER;const q=new URLSearchParams(location.search).get('ws');if(q)return q;
  if(/^https?:$/.test(location.protocol)&&!/claude/.test(location.hostname))return (location.protocol=='https:'?'wss://':'ws://')+location.host;return '';}
function wsAdapter(url){const ph=[],ch=[];let ws,open=false,me=null,last={};
  const A={presence(p){last=p;if(open)ws.send(JSON.stringify({t:'p',d:p}));return Promise.resolve();},
    emit(t,d){if(open&&t=='chat')ws.send(JSON.stringify({t:'c',d}));return Promise.resolve();},
    on(t,h){if(t=='chat')ch.push(h);return()=>{};},onPeers(h){ph.push(h);return()=>{};},connected:()=>open};
  function connect(){ws=new WebSocket(url);
    ws.onopen=()=>{open=true;ws.send(JSON.stringify({t:'p',d:last}));};
    ws.onclose=()=>{open=false;setTimeout(connect,2000);};ws.onerror=()=>{};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t=='hi')me=m.id;
      else if(m.t=='s'){const peers=m.peers.map(q=>({peer:q.id,isMe:q.id==me,sameTab:q.id==me,kind:'viewer',presence:q.p||{}}));ph.forEach(h=>h({peers}));}
      else if(m.t=='c')ch.forEach(h=>h({isMe:m.id==me,sameTab:m.id==me,data:m.d}));};}
  connect();return A;}
(async()=>{try{let r=null;if(window.claude&&claude.use)r=await claude.use('room');if(!r){const u=wsUrl();if(u)r=wsAdapter(u);}if(!r)return;ROOM=r;
  r.onPeers(syncPeers,()=>{onl.textContent='Solo';});
  r.on('chat',m=>{if(m.data&&typeof m.data.t=='string')addFeed((m.isMe&&m.sameTab?'You':String(m.data.n||'Player').slice(0,14))+': '+m.data.t.slice(0,120));},()=>{});
  onl.textContent='🌐 1 online';}catch(e){}})();

// ============ LOOP ============
let last=performance.now(),tick=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(view==0&&!look)sc.yaw+=dt*.12;
  updNPC(dt);updVeh(dt);updAct();updRemote(dt);netSend(now);updChat(now);
  const Y=view==0?sc.yaw:view==1?es.yaw:P.yaw;
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
  if(typing()){ix=0;iy=0;}
  if(joy){ix=joy.dx/50;iy=-joy.dy/50;}
  if(sv){ix=sv.dx;iy=-sv.dy;}
  let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len;len=1}
  const sy=Math.sin(Y),cy=Math.cos(Y);
  const vx=(-sy*iy+cy*ix)*CHARACTER.speed*dt,vz=(-cy*iy-sy*ix)*CHARACTER.speed*dt;
  if(RID)driveV(dt,ix,iy,len,Y);
  else if(len>.1){
    if(can(P.x+vx,P.z))P.x+=vx;
    if(can(P.x,P.z+vz))P.z+=vz;
    hum.rotation.y=Math.atan2(vx,vz);P.t+=dt*CHARACTER.speed*1.5;
  }
  const H=hAt(P.x,P.z);P.h=H?H.k:-1;
  const onR=H&&inRampH(H,P.x,P.z);
  if(onR)P.l=(P.z-H.oz)<H.ramp.z+H.ramp.d/2?1:0;
  const ty=onR?cl(FH*(H.ramp.z+H.ramp.d-(P.z-H.oz))/H.ramp.d,0,FH):P.l*FH;
  P.y+=(ty-P.y)*Math.min(1,dt*14);
  if(H&&P.z-H.oz<=52)sel=H.k;
  // build / drop houses near the player
  if((tick++)%15==0){let built=0;HS.forEach(h=>{const d=Math.hypot(P.x-(h.ox+15),P.z-(h.oz+24)),want=d<62||(h.k==sel&&view==0);
    if(want&&!h.det&&built<1){h.build();built++;}else if(!want&&h.det&&d>115)drop(h);});}
  HS.forEach(h=>{if(!h.det)return;const cur=h.k==P.h&&view==4;h.parts.g1.visible=!(cur&&P.l==0);h.parts.r0.visible=h.parts.r1.visible=!cur;h.hipG.visible=!cur;});
  HS.forEach(h=>{if(!h.det)h.hipG.visible=true;});
  const sw=len>.1?Math.sin(P.t)*.8:0;lL.rotation.x=sw;lR.rotation.x=-sw;aL.rotation.x=-sw;aR.rotation.x=sw;
  hum.position.set(P.x,P.y+(RID?.55:0),P.z);hum.visible=view!=3&&(!RID||RID.type=='okada');
  scene.fog.near=view==1?3000:110;scene.fog.far=view==1?4000:300;
  if(view==3){const fp=P.pitch-.35,e=1.6*CHARACTER.scale;cam.position.set(P.x,P.y+e,P.z);
    cam.lookAt(P.x-sy*Math.cos(fp),P.y+e-Math.sin(fp),P.z-cy*Math.cos(fp));}
  else if(view<2){const O=view?es:sc,hs=HS[sel],tx=view?(EW+AW)/2:hs.ox+hs.mc(15.5),tz=view?(EH+20)/2:hs.oz+24,hd=Math.cos(O.pitch)*O.dist,vh=Math.sin(O.pitch)*O.dist;
    cam.position.set(tx+sy*hd,(view?0:3)+vh,tz+cy*hd);cam.lookAt(tx,view?0:4,tz);}
  else{const d=view==4,dist=d?40:(RID?7:4.2),p=d?Math.max(P.pitch,.5):P.pitch,hd=Math.cos(p)*dist,vh=Math.sin(p)*dist;let s=1;
    if(!d)while(s>.2&&!ok(P.x+sy*hd*s,P.z+cy*hd*s,P.l))s-=.1;
    cam.position.set(P.x+sy*hd*s,P.y+1.5+vh*s,P.z+cy*hd*s);cam.lookAt(P.x,P.y+1.3,P.z);}
  R_.render(scene,cam);drawMap();
  document.getElementById('fl').textContent=(P.h>=0&&P.z-HS[P.h].oz<=52?"House "+(P.h+1):"Kelvin Estates")+" · "+(P.l?"First Floor":"Ground Floor");
  let n="";if(H){const i=Math.floor(P.x-H.ox),j=Math.floor(P.z-H.oz);n=H.walk[P.l][j]?.[i]?H.name[P.l][j][i]:"";}
  if(onR)n="Staircase";else if(!H)n=P.z>GZ?"Outside the Gate":"Estate Avenue";else if(P.z-H.oz>52)n="Street";
  if(n&&n!=="Doorway")document.getElementById('rm').textContent=n==="Atrium"?"Atrium (Void)":n;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(()=>hint.style.opacity=0,9000);
</script>
